name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Click-Smoother
          path: ${{ steps.build.outputs.build-output }}
